<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusPlanner – Sign In</title>
<link rel="stylesheet" href="./main.css">
<style>
  body { font-family: 'Inter', sans-serif; }
  .form-row { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
  .forgot { text-align: right; margin-top: -8px; }
  .forgot a { font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 500; }
  .forgot a:hover { text-decoration: underline; }
  .btn-full { width: 100%; justify-content: center; padding: 12px; font-size: 15px; }
</style>
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon">📚</div>
    <span>CampusPlanner</span>
  </div>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Sign in to access your study planner</p>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Email address</label>
      <input id="email" class="form-input" type="email" placeholder="you@university.edu" autocomplete="email">
      <span class="form-error" id="emailErr">Please enter your email.</span>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="password" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password">
      <span class="form-error" id="passErr">Please enter your password.</span>
    </div>
    <div class="forgot"><a href="./password.html">Forgot password?</a></div>
  </div>

  <button class="btn btn-primary btn-full" onclick="signIn()">Sign in →</button>

  <p class="auth-footer">New to CampusPlanner? <a href="./signup.html">Create a free account.</a></p>
</div>

<div class="toast success" id="toast">✅ Signing you in…</div>

<script>
function signIn() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  let ok = true;
  document.getElementById('emailErr').classList.remove('show');
  document.getElementById('passErr').classList.remove('show');
  document.getElementById('email').classList.remove('error');
  document.getElementById('password').classList.remove('error');
  if (!email) {
    document.getElementById('emailErr').classList.add('show');
    document.getElementById('email').classList.add('error');
    ok = false;
  }
  if (!pass) {
    document.getElementById('passErr').classList.add('show');
    document.getElementById('password').classList.add('error');
    ok = false;
  }
  if (!ok) return;
  seedData();
  showToast('toast');
  setTimeout(() => window.location.href = './dashboard.html', 900);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });

function showToast(id) {
  const t = document.getElementById(id);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function seedData() {
  if (JSON.parse(localStorage.getItem('cp_assignments') || '[]').length > 0) return;
  const today = new Date();
  const d = (offset) => {
    const x = new Date(today); x.setDate(x.getDate() + offset);
    return x.toISOString().split('T')[0];
  };
  const seed = [
    { id:1, title:'Research Paper',        course:'psych', dueDate: d(6),  reminder:'2', notes:'Manifest Destiny essay', completed:false, createdAt: d(-5) },
    { id:2, title:'Group Project',         course:'cs',    dueDate: d(4),  reminder:'2', notes:'HCI prototype demo',     completed:false, createdAt: d(-5) },
    { id:3, title:'Lab Report',            course:'cs',    dueDate: d(-3), reminder:'2', notes:'',                       completed:true,  createdAt: d(-8) },
    { id:4, title:'Coding Project',        course:'prog',  dueDate: d(12), reminder:'3', notes:'Nested loops chapter',   completed:false, createdAt: d(-2) },
    { id:5, title:'CS Midterm',            course:'cs',    dueDate: d(18), reminder:'7', notes:'Chapters 1–6',           completed:false, createdAt: d(-2) },
    { id:6, title:'Discrete HW',           course:'math',  dueDate: d(20), reminder:'2', notes:'Problem set 4',          completed:false, createdAt: d(-1) },
    { id:7, title:'Psychology Quiz',       course:'psych', dueDate: d(13), reminder:'1', notes:'',                       completed:false, createdAt: d(-1) },
    { id:8, title:'Programming Assignment',course:'prog',  dueDate: d(22), reminder:'2', notes:'Recursion exercises',    completed:false, createdAt: d(0)  },
  ];
  localStorage.setItem('cp_assignments', JSON.stringify(seed));
}
</script>
</body>
</html>
