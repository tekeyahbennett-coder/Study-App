<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusPlanner – Notifications</title>
<link rel="stylesheet" href="./main.css">
<style>
.tab-bar { display:flex;gap:3px;background:var(--bg);border-radius:var(--radius-sm);padding:3px;border:1.5px solid var(--border); }
.tab { padding:6px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-muted);transition:all .12s;font-family:inherit;white-space:nowrap; }
.tab.active { background:var(--card);color:var(--text);box-shadow:var(--shadow-sm); }
.tab .cnt { display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:99px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;margin-left:5px;vertical-align:middle; }
.n-item { display:flex;align-items:flex-start;gap:14px;padding:16px 22px;border-bottom:1px solid var(--border-light);transition:background .12s; }
.n-item:last-child { border-bottom:none; }
.n-item.unread { background:#fdfcff; }
.n-item:hover { background:#fafbff; }
.n-icon { width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0; }
.n-body { flex:1;min-width:0; }
.n-title { font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:3px; }
.n-sub   { font-size:13px;color:var(--text-muted);line-height:1.5; }
.n-actions { display:flex;gap:8px;margin-top:9px; }
.n-right { display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0; }
.n-time  { font-size:12px;color:var(--text-muted);white-space:nowrap; }
.n-dot   { width:8px;height:8px;border-radius:50%;background:var(--primary); }
</style>
</head>
<body class="app-layout">
<div id="sidebarMount"></div>

<div class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Notifications 🔔</h1>
      <p class="page-sub" id="unreadSub"></p>
    </div>
    <button class="btn btn-outline" onclick="markAllRead()">Mark all as read</button>
  </div>

  <div class="card">
    <div style="padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div class="tab-bar">
        <button class="tab active" onclick="setTab('all',this)">All</button>
        <button class="tab" id="tabUnread" onclick="setTab('unread',this)">Unread</button>
        <button class="tab" onclick="setTab('soon',this)">Due Soon</button>
        <button class="tab" onclick="setTab('done',this)">Completed</button>
      </div>
    </div>
    <div id="nList" style="margin-top:8px;"></div>
  </div>
</div>

<script src="./shared.js"></script>
<script>
document.getElementById('sidebarMount').innerHTML = buildSidebar('notifications');
requireLogin();

let currentTab = 'all';
function getRead()  { return JSON.parse(localStorage.getItem('cp_read')||'[]'); }
function setRead(a) { localStorage.setItem('cp_read',JSON.stringify(a)); }

function buildNotifs(){
  const today=new Date(); today.setHours(0,0,0,0);
  const read=getRead();
  const notifs=[];
  getAssignments().forEach(a=>{
    const d=diffDays(a.dueDate);
    const c=COURSES[a.course]||{};
    const rk=a.completed?`done-${a.id}`:`soon-${a.id}`;
    const isRead=read.includes(rk);
    if(a.completed){
      notifs.push({id:a.id,type:'done',rk,title:'Assignment completed',
        sub:`${a.title} – ${c.name||a.course} was marked complete. Great work!`,
        icon:'✅',soft:'#ecfdf5',diff:9999,read:isRead});
    } else if(d<0){
      notifs.push({id:a.id,type:'soon',rk,title:'Assignment overdue!',
        sub:`${a.title} – ${c.name||a.course} was due ${Math.abs(d)} day${Math.abs(d)!==1?'s':''} ago.`,
        icon:'🚨',soft:'#fff1f2',diff:d,read:isRead});
    } else if(d<=7){
      const when=d===0?'today':d===1?'tomorrow':`in ${d} days`;
      notifs.push({id:a.id,type:'soon',rk,
        title:d===0?'Due today!':d<=2?`Due ${when}`:`Upcoming: ${a.title}`,
        sub:`${a.title} – ${c.name||a.course} is due ${when}.`,
        icon:c.icon||'📋',soft:c.soft||'#ede9fe',diff:d,read:isRead});
    }
  });
  return notifs.sort((a,b)=>(a.read-b.read)||(a.diff-b.diff));
}

function timeLabel(d){
  if(d<0) return `${Math.abs(d)}d ago`;
  if(d===0) return 'Today';
  if(d===1) return 'Tomorrow';
  return `In ${d}d`;
}

function setTab(t,el){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render(){
  const all=buildNotifs();
  const unread=all.filter(n=>!n.read);
  document.getElementById('unreadSub').textContent=`${unread.length} unread reminder${unread.length!==1?'s':''}`;
  const tu=document.getElementById('tabUnread');
  tu.innerHTML=`Unread${unread.length?`<span class="cnt">${unread.length}</span>`:''}`;

  let list=all;
  if(currentTab==='unread') list=all.filter(n=>!n.read);
  if(currentTab==='soon')   list=all.filter(n=>n.type==='soon');
  if(currentTab==='done')   list=all.filter(n=>n.type==='done');

  const el=document.getElementById('nList');
  if(!list.length){
    el.innerHTML='<div style="text-align:center;padding:56px 20px;color:var(--text-muted);font-size:13.5px;"><div style="font-size:36px;margin-bottom:10px;">🎉</div>Nothing here!</div>';
    return;
  }
  el.innerHTML=list.map(n=>`
    <div class="n-item${n.read?'':' unread'}">
      <div class="n-icon" style="background:${n.soft}">${n.icon}</div>
      <div class="n-body">
        <div class="n-title">${n.title}</div>
        <div class="n-sub">${n.sub}</div>
        <div class="n-actions">
          <a class="btn btn-outline btn-sm" href="./calendar.html">View calendar</a>
          <button class="btn btn-ghost btn-sm" onclick="dismiss('${n.rk}')">Dismiss</button>
        </div>
      </div>
      <div class="n-right">
        <span class="n-time">${timeLabel(n.diff)}</span>
        ${!n.read?'<div class="n-dot"></div>':''}
      </div>
    </div>`).join('');
}

function dismiss(rk){ const r=getRead(); if(!r.includes(rk))r.push(rk); setRead(r); render(); }
function markAllRead(){ const r=getRead(); buildNotifs().forEach(n=>{if(!r.includes(n.rk))r.push(n.rk);}); setRead(r); render(); showToast('All notifications marked as read'); }

render();
</script>
</body>
</html>
