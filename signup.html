<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusPlanner – Notifications</title>
<link rel="stylesheet" href="./main.css">
<style>
.filter-tabs {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.tab {
  padding: 6px 16px; border-radius: 99px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1.5px solid var(--border);
  background: var(--card); color: var(--text-muted); transition: all .12s;
}
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.notif-list { display: flex; flex-direction: column; }
.notif-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px 22px; border-bottom: 1px solid var(--border);
  transition: background .12s;
}
.notif-item:last-child { border-bottom: none; }
.notif-item.unread { background: #fafbff; }
.notif-item:hover { background: var(--bg); }
.notif-icon {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.notif-sub   { font-size: 13px; color: var(--text-muted); }
.notif-time  { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.notif-dot   {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary); flex-shrink: 0; margin-top: 6px;
}
.notif-actions { display: flex; gap: 8px; margin-top: 8px; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); font-size:14px; }
.empty-icon  { font-size:40px; margin-bottom:10px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">📚</div>
    <span>CampusPlanner</span>
  </div>
  <div class="nav-section">
    <div class="nav-label">Navigation</div>
    <a class="nav-item" href="./dashboard.html"><span class="ni">🏠</span> Dashboard</a>
    <a class="nav-item" href="./calendar.html"><span class="ni">📅</span> Calendar</a>
    <a class="nav-item" href="./addAssignment.html"><span class="ni">➕</span> Add Assignment</a>
    <a class="nav-item active" href="./notifications.html"><span class="ni">🔔</span> Notifications</a>
  </div>
  <div class="nav-section">
    <div class="nav-label">Courses</div>
    <a class="nav-item" href="./course.html?course=cs"><span class="course-dot" style="background:var(--cs)"></span> Computer Science</a>
    <a class="nav-item" href="./course.html?course=prog"><span class="course-dot" style="background:var(--prog)"></span> Programming</a>
    <a class="nav-item" href="./course.html?course=psych"><span class="course-dot" style="background:var(--psych)"></span> Psychology</a>
    <a class="nav-item" href="./course.html?course=math"><span class="course-dot" style="background:var(--math)"></span> Discrete Math</a>
  </div>
  <div class="sidebar-footer">
    <div class="profile-block">
      <div class="avatar">JD</div>
      <div>
        <div class="profile-name">John Doe</div>
        <div class="profile-sub">Junior • CS Major</div>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Notifications 🔔</h1>
      <p class="page-sub" id="unreadLabel"></p>
    </div>
    <button class="btn btn-outline" onclick="markAllRead()">Mark all as read</button>
  </div>

  <div class="card">
    <div style="padding:16px 22px 0; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div class="filter-tabs">
        <div class="tab active" onclick="setFilter('all',this)">All</div>
        <div class="tab" onclick="setFilter('unread',this)">Unread</div>
        <div class="tab" onclick="setFilter('soon',this)">Due Soon</div>
        <div class="tab" onclick="setFilter('completed',this)">Completed</div>
      </div>
    </div>
    <div class="notif-list" id="notifList" style="margin-top:8px;"></div>
  </div>
</div>

<script>
const COURSES = {
  cs:    { name:'Computer Science', color:'#6366f1', soft:'#eef2ff', icon:'📘' },
  prog:  { name:'Programming',      color:'#ef4444', soft:'#fef2f2', icon:'💻' },
  psych: { name:'Psychology',       color:'#f59e0b', soft:'#fffbeb', icon:'🧠' },
  math:  { name:'Discrete Math',    color:'#10b981', soft:'#ecfdf5', icon:'📐' },
};

function getAssignments() { return JSON.parse(localStorage.getItem('cp_assignments') || '[]'); }
function saveAssignments(arr) { localStorage.setItem('cp_assignments', JSON.stringify(arr)); }
function getRead() { return JSON.parse(localStorage.getItem('cp_read') || '[]'); }
function setRead(arr) { localStorage.setItem('cp_read', JSON.stringify(arr)); }

let currentFilter = 'all';

function buildNotifications() {
  const today = new Date(); today.setHours(0,0,0,0);
  const assignments = getAssignments();
  const readIds = getRead();
  const notifs = [];

  assignments.forEach(a => {
    const due = new Date(a.dueDate + 'T00:00:00');
    const diff = Math.ceil((due - today) / 86400000);
    const c = COURSES[a.course] || {};

    if (a.completed) {
      notifs.push({ id: a.id, type:'completed', title:'Assignment completed', sub:`${a.title} – ${c.name||a.course} was marked complete. Great work!`, icon:'✅', soft:'#ecfdf5', color:'#10b981', diff: 9999, read: readIds.includes(`done-${a.id}`) });
    } else if (diff === 0) {
      notifs.push({ id: a.id, type:'soon', title:'Assignment due today!', sub:`${a.title} – ${c.name||a.course} is due today.`, icon:'🚨', soft:'#fef2f2', color:'#ef4444', diff, read: readIds.includes(`soon-${a.id}`) });
    } else if (diff > 0 && diff <= 3) {
      notifs.push({ id: a.id, type:'soon', title:`Assignment due in ${diff} day${diff>1?'s':''}`, sub:`${a.title} – ${c.name||a.course} is due ${diff===1?'tomorrow':'in '+diff+' days'}.`, icon: c.icon||'📋', soft: c.soft||'#eef2ff', color: c.color||'#6366f1', diff, read: readIds.includes(`soon-${a.id}`) });
    } else if (diff > 3 && diff <= 7) {
      notifs.push({ id: a.id, type:'soon', title:`Upcoming: ${a.title}`, sub:`${c.name||a.course} is due in ${diff} days.`, icon: c.icon||'📋', soft: c.soft||'#eef2ff', color: c.color||'#6366f1', diff, read: readIds.includes(`soon-${a.id}`) });
    }
  });

  // Sort: unread first, then by diff
  notifs.sort((a,b) => (a.read - b.read) || (a.diff - b.diff));
  return notifs;
}

function timeAgo(diff) {
  if (diff <= 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return `In ${diff} days`;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const all = buildNotifications();
  const readIds = getRead();
  const unreadCount = all.filter(n => !n.read).length;
  document.getElementById('unreadLabel').textContent = `${unreadCount} unread reminder${unreadCount!==1?'s':''}`;

  let filtered = all;
  if (currentFilter === 'unread')    filtered = all.filter(n => !n.read);
  if (currentFilter === 'soon')      filtered = all.filter(n => n.type === 'soon');
  if (currentFilter === 'completed') filtered = all.filter(n => n.type === 'completed');

  const list = document.getElementById('notifList');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🎉</div>Nothing here!</div>`;
    return;
  }

  list.innerHTML = filtered.map(n => {
    const readKey = n.type === 'completed' ? `done-${n.id}` : `soon-${n.id}`;
    return `<div class="notif-item${n.read?'':' unread'}" id="notif-${readKey}">
      <div class="notif-icon" style="background:${n.soft}">${n.icon}</div>
      <div class="notif-body">
        <div class="notif-title">${n.title}</div>
        <div class="notif-sub">${n.sub}</div>
        <div class="notif-actions">
          <a class="btn btn-outline btn-sm" href="./calendar.html">View calendar</a>
          <button class="btn btn-ghost btn-sm" onclick="dismiss('${readKey}')">Dismiss</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <span class="notif-time">${timeAgo(n.diff)}</span>
        ${!n.read ? `<div class="notif-dot"></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function dismiss(key) {
  const r = getRead();
  if (!r.includes(key)) r.push(key);
  setRead(r);
  render();
}

function markAllRead() {
  const all = buildNotifications();
  const r = getRead();
  all.forEach(n => {
    const key = n.type === 'completed' ? `done-${n.id}` : `soon-${n.id}`;
    if (!r.includes(key)) r.push(key);
  });
  setRead(r);
  render();
}

render();
</script>
</body>
</html>
