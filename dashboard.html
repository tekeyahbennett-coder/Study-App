<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusPlanner – Calendar</title>
<link rel="stylesheet" href="./main.css">
<style>
.cal-shell { display:flex;flex-direction:column;gap:14px;flex:1;min-height:0; }
.cal-topbar { display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
.cal-nav { display:flex;align-items:center;gap:10px; }
.cal-arrow { width:32px;height:32px;border-radius:var(--radius-sm);background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text-muted);transition:all .12s; }
.cal-arrow:hover { background:var(--bg);color:var(--text);border-color:#c8d0dc; }
.cal-month { font-size:18px;font-weight:800;min-width:160px;text-align:center;letter-spacing:-.02em; }
.cal-legend { display:flex;flex-wrap:wrap;gap:12px;align-items:center; }
.leg-item { display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-muted); }
.leg-dot  { width:9px;height:9px;border-radius:50%;flex-shrink:0; }
.view-btns { display:flex;gap:3px;background:var(--bg);border-radius:var(--radius-sm);padding:3px;border:1.5px solid var(--border); }
.view-btn { padding:5px 14px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-muted);transition:all .12s;font-family:inherit; }
.view-btn.active  { background:var(--card);color:var(--text);box-shadow:var(--shadow-sm); }
.view-btn.off     { opacity:.4;cursor:not-allowed; }
.cal-grid { background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;display:grid;grid-template-columns:repeat(7,1fr);box-shadow:var(--shadow-sm);flex:1; }
.cal-dh { padding:10px 8px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);background:var(--bg);border-bottom:1px solid var(--border); }
.cal-cell { border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 7px;min-height:88px; }
.cal-cell:nth-child(7n){ border-right:none; }
.cal-cell.other { background:#fafbfc; }
.cal-cell.other .cal-date { color:#ccd4de; }
.cal-cell.is-today { background:#f5f3ff; }
.cal-date { font-size:12px;font-weight:600;color:var(--text-muted);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:3px; }
.cal-cell.is-today .cal-date { background:var(--primary);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(109,87,248,.4); }
.cal-event { font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:filter .12s,transform .1s;display:block; }
.cal-event:hover { filter:brightness(.92);transform:translateY(-1px); }
.cal-event.cs    { background:var(--cs-soft);    color:var(--cs);   }
.cal-event.prog  { background:var(--prog-soft);  color:var(--prog); }
.cal-event.psych { background:var(--psych-soft); color:#92400e;     }
.cal-event.math  { background:var(--math-soft);  color:var(--math); }
.cal-event.done  { background:var(--done-soft);  color:var(--done); text-decoration:line-through; }
.cal-event.new-item { animation:flashIn .6s ease; }
@keyframes flashIn { 0%{transform:scale(1.08);filter:brightness(1.2);} 100%{transform:scale(1);filter:brightness(1);} }
.modal-row { display:flex;gap:10px;align-items:flex-start;margin-bottom:11px;font-size:13.5px; }
.modal-lbl { color:var(--text-muted);font-weight:600;min-width:90px; }
.modal-val { color:var(--text);font-weight:500; }
</style>
</head>
<body class="app-layout">
<div id="sidebarMount"></div>

<div class="main" style="gap:16px;">
  <div class="page-header">
    <div>
      <h1 class="page-title">Calendar 📅</h1>
      <p class="page-sub">View and manage all assignments by date</p>
    </div>
    <a class="btn btn-primary" href="./addAssignment.html">+ Add Assignment</a>
  </div>

  <div class="cal-shell">
    <div class="cal-topbar">
      <div class="cal-nav">
        <div class="cal-arrow" onclick="changeMonth(-1)">&#8249;</div>
        <div class="cal-month" id="monthLbl"></div>
        <div class="cal-arrow" onclick="changeMonth(1)">&#8250;</div>
      </div>
      <div class="cal-legend" id="calLegend"></div>
      <div class="view-btns">
        <button class="view-btn active">Month</button>
        <button class="view-btn off" title="Week view – coming soon" onclick="showToast('Week view coming soon!','success')">Week</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid">
      <div class="cal-dh">Sun</div><div class="cal-dh">Mon</div><div class="cal-dh">Tue</div>
      <div class="cal-dh">Wed</div><div class="cal-dh">Thu</div><div class="cal-dh">Fri</div><div class="cal-dh">Sat</div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="modal">
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-row"><span class="modal-lbl">Course</span><span class="modal-val" id="mCourse"></span></div>
    <div class="modal-row"><span class="modal-lbl">Due Date</span><span class="modal-val" id="mDue"></span></div>
    <div class="modal-row"><span class="modal-lbl">Priority</span><span class="modal-val" id="mPriority"></span></div>
    <div class="modal-row" id="mEstRow"><span class="modal-lbl">Est. Time</span><span class="modal-val" id="mEst"></span></div>
    <div class="modal-row" id="mNotesRow"><span class="modal-lbl">Notes</span><span class="modal-val" id="mNotes" style="white-space:pre-wrap;"></span></div>
    <div class="modal-actions">
      <button class="btn btn-primary btn-sm" id="mToggle" onclick="toggleFromModal()">Mark Complete</button>
      <a class="btn btn-outline btn-sm" id="mEdit">✏️ Edit</a>
      <button class="btn btn-danger btn-sm" onclick="deleteFromModal()">🗑 Delete</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('overlay').classList.remove('open')">Close</button>
    </div>
  </div>
</div>

<script src="./shared.js"></script>
<script>
document.getElementById('sidebarMount').innerHTML = buildSidebar('calendar');
requireLogin();

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let yr = new Date().getFullYear();
let mo = new Date().getMonth();
let activeId = null;

function changeMonth(dir) {
  mo += dir;
  if(mo>11){mo=0;yr++;} if(mo<0){mo=11;yr--;}
  render();
}

function render() {
  document.getElementById('monthLbl').textContent = `${MONTHS[mo]} ${yr}`;
  document.getElementById('calLegend').innerHTML = Object.entries(COURSES).map(([k,c])=>
    `<div class="leg-item"><span class="leg-dot" style="background:${c.color}"></span>${c.name}</div>`
  ).join('') + `<div class="leg-item"><span class="leg-dot" style="background:var(--done)"></span>Completed</div>`;

  const grid = document.getElementById('calGrid');
  while(grid.children.length>7) grid.removeChild(grid.lastChild);

  const assignments = getAssignments();
  const firstDay    = new Date(yr,mo,1).getDay();
  const daysInMonth = new Date(yr,mo+1,0).getDate();
  const prevDays    = new Date(yr,mo,0).getDate();
  const todayStr    = new Date().toISOString().split('T')[0];
  const newId       = parseInt(sessionStorage.getItem('cp_new_id')||'0');

  // Prev month filler
  for(let i=firstDay-1;i>=0;i--) {
    const c=document.createElement('div'); c.className='cal-cell other';
    c.innerHTML=`<div class="cal-date">${prevDays-i}</div>`; grid.appendChild(c);
  }

  // Current month
  for(let d=1;d<=daysInMonth;d++) {
    const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===todayStr;
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday?' is-today':'');
    const dateDiv = document.createElement('div');
    dateDiv.className='cal-date'; dateDiv.textContent=d; cell.appendChild(dateDiv);
    assignments.filter(a=>a.dueDate===dateStr).forEach(a=>{
      const c = COURSES[a.course]||{};
      const ev = document.createElement('div');
      ev.className=`cal-event ${a.completed?'done':a.course}${a.id===newId?' new-item':''}`;
      ev.textContent=a.title;
      ev.title=`${a.title} · ${c.name||a.course}`;
      ev.onclick=e=>{e.stopPropagation();openModal(a.id);};
      cell.appendChild(ev);
    });
    grid.appendChild(cell);
  }

  // Next month filler
  const total=firstDay+daysInMonth;
  const rem=total%7===0?0:7-(total%7);
  for(let i=1;i<=rem;i++){
    const c=document.createElement('div'); c.className='cal-cell other';
    c.innerHTML=`<div class="cal-date">${i}</div>`; grid.appendChild(c);
  }
}

function openModal(id) {
  const a=getAssignments().find(x=>x.id===id); if(!a) return;
  activeId=id;
  const c=COURSES[a.course]||{};
  document.getElementById('mTitle').textContent=a.title;
  document.getElementById('mCourse').innerHTML=`<span class="badge badge-${a.course}">${c.name||a.course}</span>`;
  document.getElementById('mDue').textContent=fmtDate(a.dueDate);
  document.getElementById('mPriority').textContent=a.priority?a.priority.charAt(0).toUpperCase()+a.priority.slice(1):'Medium';
  document.getElementById('mEst').textContent=a.estHours?`${a.estHours} hours`:'—';
  document.getElementById('mEstRow').style.display=a.estHours?'flex':'none';
  document.getElementById('mNotes').textContent=a.notes||'—';
  document.getElementById('mNotesRow').style.display='flex';
  document.getElementById('mEdit').href=`./addAssignment.html?edit=${id}`;
  const btn=document.getElementById('mToggle');
  btn.textContent=a.completed?'Mark Incomplete':'Mark Complete';
  btn.className=a.completed?'btn btn-outline btn-sm':'btn btn-primary btn-sm';
  document.getElementById('overlay').classList.add('open');
}
function toggleFromModal(){
  const arr=getAssignments(); const a=arr.find(x=>x.id===activeId); if(!a) return;
  a.completed=!a.completed; saveAssignments(arr);
  showToast(a.completed?'✅ Marked complete!':'↩ Marked incomplete');
  document.getElementById('overlay').classList.remove('open');
  render();
}
function deleteFromModal(){
  if(!confirm('Delete this assignment?')) return;
  saveAssignments(getAssignments().filter(x=>x.id!==activeId));
  document.getElementById('overlay').classList.remove('open');
  showToast('🗑 Assignment deleted');
  render();
}
function closeOverlay(e){ if(e.target===document.getElementById('overlay')) document.getElementById('overlay').classList.remove('open'); }

// Navigate to current month if coming back after save
const savedDate = sessionStorage.getItem('cp_new_date');
if (savedDate) {
  const d = new Date(savedDate+'T00:00:00');
  yr = d.getFullYear(); mo = d.getMonth();
  sessionStorage.removeItem('cp_new_date');
}

render();
</script>
</body>
</html>
